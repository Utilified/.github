name: Reusable - Security Audit (pip/poetry)

# Blocking dependency-vulnerability gate for Python/Poetry projects.
# Combines:
#   - pip-audit --strict (fails on ANY advisory)
#   - GitHub dependency-review-action (PR-only, OPT-IN via input -
#     requires GitHub Advanced Security on private repos)
#   - step-security/harden-runner (network egress audit)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"
      pip-audit-version:
        description: "pip-audit version (pinned)"
        required: false
        type: string
        default: "2.7.3"
      enable-dependency-review:
        description: "Enable GitHub dependency-review-action (requires GHAS on private repos)"
        required: false
        type: boolean
        default: false
      ignore-vulns:
        description: "Space-separated advisory IDs to suppress (e.g. 'PYSEC-2025-183'). Each caller MUST justify suppressions in their wrapper workflow. Use only for disputed or unfixable advisories."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  pip-audit:
    name: pip-audit (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install poetry-plugin-export
        # `poetry export` was extracted into a plugin in Poetry 2.x.
        run: poetry self add poetry-plugin-export

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Install pip-audit (pinned)
        env:
          PIP_AUDIT_VERSION: ${{ inputs.pip-audit-version }}
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Run pip-audit (strict, fail on any finding)
        env:
          IGNORE_VULNS: ${{ inputs.ignore-vulns }}
        run: |
          poetry export -f requirements.txt --without-hashes --output requirements.audit.txt
          ignore_args=""
          for vuln in $IGNORE_VULNS; do
            ignore_args="$ignore_args --ignore-vuln $vuln"
          done
          pip-audit --strict --requirement requirements.audit.txt --desc on $ignore_args

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && inputs.enable-dependency-review
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@907a6e9569212033966bc0b69d32473b046dd66b # v4.5.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
