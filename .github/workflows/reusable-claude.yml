name: Reusable - Claude Code

on:
  workflow_call:
    inputs:
      claude-args:
        description: |
          Optional CLI args forwarded to claude-code-action via its
          `claude_args` input. Use for things like
          `--allowedTools "Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"`
          or `--model claude-sonnet-5-5`. Passing this replaces the default,
          so include `--model`/`--effort` if you still want them pinned.
          `--setting-sources user` is always appended and cannot be
          overridden: repo `.claude/settings.json` never loads.
        required: false
        type: string
        default: '--model claude-opus-5-5 --effort high'
      prompt:
        description: |
          Optional explicit prompt for claude-code-action. Leave empty to
          let the action auto-detect mode from the triggering event
          (@claude mention, PR review, issue assignment, etc.).
        required: false
        type: string
        default: ''
    # No declared `secrets:` — GitHub secret names cannot contain hyphens, so
    # declaring `claude-code-oauth-token` here (and passing it from callers)
    # was rejected at parse time and produced a 0s startup_failure on every
    # run. Callers pass `secrets: inherit`, and the token is read directly as
    # ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} below.

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: ${{ inputs.prompt }}
          # --setting-sources user is enforced, never left to callers: on a PR
          # the action restores .claude/ from the base branch, so the repo's
          # committed settings load as-is. Those are laptop config and can
          # carry hooks that call PR-controlled scripts (they run before any
          # tool gating, with the Claude token in the env) and broad Bash
          # allow lists that merge with --allowedTools. It comes last because
          # the action keeps the last value of a repeated flag. Side effect:
          # CLAUDE.md/AGENTS.md no longer auto-load, and project allow lists
          # don't apply; callers grant tools explicitly via claude-args.
          claude_args: |
            ${{ inputs.claude-args }}
            --setting-sources user
