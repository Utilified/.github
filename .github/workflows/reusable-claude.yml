name: Reusable - Claude Code

# `@claude` in an issue or PR comment or review. Only the repo's own people can
# start it (author_association is GitHub's statement of the commenter's
# standing, not anything the commenter writes), and what it can do is an
# explicit tool list. Issue and PR text is untrusted input to the agent.
#
# Callers pass exactly one secret, never `secrets: inherit`, which would hand
# the agent every repo and org secret:
#
#   secrets:
#     CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

on:
  workflow_call:
    inputs:
      claude-args:
        description: |
          Model and effort flags, plus any extra CLI args, forwarded to
          claude-code-action's `claude_args`. Tool limits go in
          `allowed-tools` / `disallowed-tools`, which come after this and win.
        required: false
        type: string
        default: '--model claude-opus-5-5 --effort high'
      allowed-tools:
        description: |
          `--allowedTools` list. The default reads and edits files and runs
          read-only git and gh, with no test, lint or build runner: the agent
          never executes PR code; CI does. The action adds its own comment and
          commit tools on top.
        required: false
        type: string
        default: 'Read,Glob,Grep,LS,Edit,MultiEdit,Write,Bash(git status:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)'
      disallowed-tools:
        description: |
          `--disallowedTools` list; a deny beats any allow. The default keeps
          the agent out of .github/ (workflows, CODEOWNERS) and denies
          `git diff` / `git log`: the action allows both with any arguments,
          and their --output=<file> is a file write no Edit/Write deny sees.
          The agent reads diffs with `gh pr diff`.
        required: false
        type: string
        default: 'Edit(.github/**),MultiEdit(.github/**),Write(.github/**),Bash(git diff:*),Bash(git log:*)'
      prompt:
        description: |
          Optional explicit prompt for claude-code-action. Leave empty to
          let the action auto-detect mode from the triggering event
          (@claude mention, PR review, issue assignment, etc.).
        required: false
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # The action trades an OIDC token for the Claude GitHub App's installation
      # token, which does the writing; actions: read lets Claude read CI results.
      id-token: write
      actions: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: ${{ inputs.prompt }}
          # --setting-sources user is enforced, never left to callers: on a PR
          # the action restores .claude/ from the base branch, so the repo's
          # committed settings load as-is. Those are laptop config and can
          # carry hooks that call PR-controlled scripts (they run before any
          # tool gating, with the Claude token in the env) and broad Bash
          # allow lists that merge with --allowedTools. The action keeps the
          # last value of a repeated flag, so the tool limits and this flag
          # come after the caller's args. CLAUDE.md/AGENTS.md no longer
          # auto-load, hence the system prompt.
          claude_args: |
            ${{ inputs.claude-args }}
            --append-system-prompt "Read the root AGENTS.md (and the AGENTS.md of every directory you change, if it has one) before editing."
            --allowedTools "${{ inputs.allowed-tools }}"
            --disallowedTools "${{ inputs.disallowed-tools }}"
            --setting-sources user
