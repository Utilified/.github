name: Self-tests

# The reusable workflows here are consumed org-wide, and their `run:` blocks get
# no exercise in this repo otherwise. `tests/` holds shell harnesses that pull a
# step's script straight out of its YAML and run it against scratch fixtures.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shell test harnesses
        run: |
          set -euo pipefail
          shopt -s nullglob
          harnesses=(tests/*.test.sh)
          if [ ${#harnesses[@]} -eq 0 ]; then
            echo "::error::No harnesses found under tests/ - this job would otherwise pass having run nothing."
            exit 1
          fi
          for t in "${harnesses[@]}"; do
            echo "==> $t"
            bash "$t"
          done
