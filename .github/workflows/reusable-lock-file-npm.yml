name: Reusable - Lock File Maintenance (npm)

on:
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies (no lifecycle scripts)
        run: npm install --ignore-scripts

      # npm drops the `libc` discriminators off native-binary entries when it
      # rewrites a lock file. Those keys are how it tells the glibc and musl
      # builds apart, so without them an install inside a musl container can
      # resolve a glibc binary and fail at runtime rather than at install time.
      #
      # This has to be caught here. The PR below is authored with GITHUB_TOKEN,
      # and GitHub suppresses `pull_request` triggers for GITHUB_TOKEN-authored
      # events — so the refresh PR gets no checks at all, and a silent
      # deletion-only diff would otherwise merge on a glance.
      - name: Refuse a refresh that drops libc discriminators
        run: |
          removed=$(git diff -U0 -- package-lock.json | grep -c '^-.*"libc"' || true)
          added=$(git diff -U0 -- package-lock.json | grep -c '^+.*"libc"' || true)
          if [ "$removed" -gt "$added" ]; then
            echo "::error::This refresh removes $((removed - added)) libc discriminator(s) from package-lock.json."
            echo "The glibc/musl split for native binaries would be lost. Not opening a PR."
            git diff -U0 -- package-lock.json | grep -B2 '^-.*"libc"' || true
            exit 1
          fi
          echo "libc discriminators intact (removed=$removed added=$added)"

      # Consumers protect `main`, so pushing the refreshed lock file directly
      # is rejected with GH006 on every week the lock actually changes
      # (Utilified/.github#7). Open a PR instead, so a human sees the change.
      # Note it does NOT get a CI run: create-pull-request authors with
      # GITHUB_TOKEN, and GitHub suppresses `pull_request` triggers for
      # GITHUB_TOKEN-authored events. The guard above is the only gate.
      - name: Open lock file PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: package-lock.json
          branch: chore/lock-file-maintenance-npm
          commit-message: "chore: update package-lock.json"
          title: "chore: update package-lock.json"
          body: |
            Weekly lock file maintenance — `npm install --ignore-scripts` refresh.

            Opened by the shared `reusable-lock-file-npm.yml` workflow.
          delete-branch: true
