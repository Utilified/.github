name: Reusable - Lock File Maintenance (npm)

on:
  workflow_call: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies (no lifecycle scripts)
        run: npm install --ignore-scripts

      # npm drops the `libc` discriminators off native-binary entries when it
      # rewrites a lock file. Those keys are how it tells the glibc and musl
      # builds apart, so without them an install inside a musl container can
      # resolve a glibc binary and fail at runtime rather than at install time.
      #
      # This has to be caught here. The PR below is authored with GITHUB_TOKEN,
      # and GitHub suppresses `pull_request` triggers for GITHUB_TOKEN-authored
      # events — so the refresh PR gets no checks at all, and a silent
      # deletion-only diff would otherwise merge on a glance.
      - name: Refuse a refresh that drops libc discriminators
        run: |
          set -euo pipefail

          lock=package-lock.json

          # Fail closed. "I found no problem" and "I inspected nothing" must not
          # print the same line, so anything that leaves the guard with nothing
          # to look at is an error, not a pass.
          if [ ! -f "$lock" ]; then
            echo "::error::No $lock at the repository root, so the libc guard could not inspect this refresh. Not opening a PR."
            exit 1
          fi
          if ! git cat-file -e "HEAD:$lock" 2>/dev/null; then
            echo "::error::$lock is not tracked at the repository root in HEAD, so the libc guard has no baseline to compare against. Not opening a PR."
            exit 1
          fi

          if git diff --quiet -- "$lock"; then
            echo "$lock is unchanged by this refresh - nothing to verify, and nothing to open a PR for."
            exit 0
          fi

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          git show "HEAD:$lock" > "$work/before.json"

          has_packages() { jq -e '(.packages? | type) == "object"' "$1" >/dev/null 2>&1; }
          if ! has_packages "$work/before.json"; then
            echo "::error::$lock in HEAD has no \"packages\" map (unreadable or an unexpected lock file version), so there is nothing the libc guard can compare. Not opening a PR."
            exit 1
          fi
          if ! has_packages "$lock"; then
            echo "::error::The refreshed $lock has no \"packages\" map (unreadable or an unexpected lock file version). Not opening a PR."
            exit 1
          fi

          # Compare per-entry identity, not a net line count. Counting treats
          # libc keys as fungible, so a refresh that strips the key off one
          # entry while adding a new native package carrying its own cancels to
          # zero - which is precisely the churn this guard exists to catch.
          libc_paths() {
            jq -r '.packages | to_entries[] | select(.value.libc != null) | .key' "$1" | LC_ALL=C sort
          }
          libc_paths "$work/before.json" > "$work/libc-before"
          libc_paths "$lock" > "$work/libc-after"
          jq -r '.packages | keys[]' "$lock" | LC_ALL=C sort > "$work/entries-after"

          # Lost the key but kept the entry = the discriminator was stripped.
          # Lost the key along with the entry = the dependency is simply gone,
          # which is a legitimate refresh and must not trip the guard.
          comm -23 "$work/libc-before" "$work/libc-after" > "$work/untagged"
          comm -12 "$work/untagged" "$work/entries-after" > "$work/stripped"

          if [ -s "$work/stripped" ]; then
            echo "::error::This refresh strips the libc discriminator from $(wc -l < "$work/stripped" | tr -d ' ') package-lock.json entry/entries that still exist."
            echo "The glibc/musl split for native binaries would be lost. Not opening a PR. Affected entries:"
            sed 's/^/  - /' "$work/stripped"
            exit 1
          fi

          tagged=$(wc -l < "$work/libc-before" | tr -d ' ')
          if [ "$tagged" -eq 0 ]; then
            echo "No entry in $lock carried a libc discriminator before this refresh, so none could be lost."
          else
            echo "libc discriminators intact: all $tagged tagged entry/entries either kept theirs or were removed outright."
          fi

      # Consumers protect `main`, so pushing the refreshed lock file directly
      # is rejected with GH006 on every week the lock actually changes
      # (Utilified/.github#7). Open a PR instead, so a human sees the change.
      # Note it does NOT get a CI run: create-pull-request authors with
      # GITHUB_TOKEN, and GitHub suppresses `pull_request` triggers for
      # GITHUB_TOKEN-authored events. The guard above is the only gate.
      - name: Open lock file PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: package-lock.json
          branch: chore/lock-file-maintenance-npm
          commit-message: "chore: update package-lock.json"
          title: "chore: update package-lock.json"
          body: |
            Weekly lock file maintenance — `npm install --ignore-scripts` refresh.

            Opened by the shared `reusable-lock-file-npm.yml` workflow.
          delete-branch: true
