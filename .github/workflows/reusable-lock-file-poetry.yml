name: Reusable - Lock File Maintenance (Poetry)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version for lock file refresh'
        required: false
        type: string
        default: '3.12'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Update lock file
        run: poetry lock

      # Consumers protect `main`, so pushing the refreshed lock file directly
      # is rejected with GH006 on every week the lock actually changes
      # (Utilified/.github#7). Open a PR instead — it also gives the refresh
      # a CI run before it lands.
      - name: Open lock file PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: poetry.lock
          branch: chore/lock-file-maintenance-poetry
          commit-message: "chore: update poetry.lock"
          title: "chore: update poetry.lock"
          body: |
            Weekly lock file maintenance — `poetry lock` refresh.

            Opened by the shared `reusable-lock-file-poetry.yml` workflow.
          delete-branch: true
