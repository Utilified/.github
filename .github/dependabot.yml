version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"  # 1st of the month, 05:00 Melbourne
      timezone: Australia/Melbourne
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
    open-pull-requests-limit: 3
    target-branch: main
    assignees: [cohenrobinson]
    labels: [dependencies, github-actions]
    groups:
      github-actions-all:
        patterns: ["*"]
