version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "21:00"
      timezone: Australia/Melbourne
    cooldown:
      default-days: 5
      semver-major-days: 7
      semver-minor-days: 5
      semver-patch-days: 3
    open-pull-requests-limit: 3
    target-branch: main
    assignees: [cohenrobinson]
    labels: [dependencies, github-actions]
    groups:
      github-actions-all:
        patterns: ["*"]
